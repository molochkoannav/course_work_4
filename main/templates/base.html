<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Сервис рассылок{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="{% url 'main:index' %}">Рассылки</a>
        <div class="navbar-nav">
            <a class="nav-link" href="{% url 'main:addressee_list' %}">Получатели</a>
            <a class="nav-link" href="{% url 'main:message_list' %}">Сообщения</a>
            <a class="nav-link" href="{% url 'main:newsletter_list' %}">Рассылки</a>
        </div>
    </div>
</nav>
<div class="container">
    {% if messages %}
        {% for msg in messages %}
            <div class="alert alert-{{ msg.tags }}">{{ msg }}</div>
        {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
</div>
</body>
</html>
