{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="mb-0">Сообщения</h1>
    <a href="{% url 'main:message_create' %}" class="btn btn-accent px-4">Добавить</a>
</div>

<div class="table-responsive">
    <table class="table custom-table align-middle">
        <thead>
            <tr>
                <th>Тема</th>
                <th>Тело</th>
                <th class="text-end">Действия</th>
            </tr>
        </thead>
        <tbody>
        {% for m in messages %}
            <tr>
                <td>{{ m.subject }}</td>
                <td>{{ m.body|truncatechars:80 }}</td>
                <td class="text-end text-nowrap">
                    {% if a.owner == request.user %}
                    <a href="{% url 'main:message_update' m.pk %}" class="btn btn-sm btn-action">Изменить</a>
                    <a href="{% url 'main:message_delete' m.pk %}" class="btn btn-sm btn-action-danger">Удалить</a>
                       {% endif %}
                </td>
            </tr>
        {% empty %}
            <tr>
                <td colspan="3" class="text-center py-4" style="color: var(--text-color); opacity: 0.7;">Нет сообщений.</td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
