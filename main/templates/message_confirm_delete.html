{% extends 'base.html' %}
{% block content %}
<div class="mt-4">
    <h1 class="mb-4">Удалить сообщение?</h1>

    <div class="alert alert-warning" role="alert"
         style="background-color: var(--nav-bg); color: var(--accent-color); border: 1px solid var(--accent-color);">
        Вы уверены, что хотите удалить сообщение <strong>«{{ object.subject }}»</strong>?
    </div>

    <form method="post">
        {% csrf_token %}
        <div class="d-flex gap-3 mt-4">
            <button type="submit" class="btn btn-danger px-4">Удалить</button>
            <a href="{% url 'main:message_list' %}" class="btn btn-cancel px-4">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
