{% extends 'base.html' %}

{% block title %}Вход{% endblock %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: flex-start; height: 100%;">
    <!-- Убрали transform: scale, чтобы форма не съезжала при ошибках -->
    <div class="form-container" style="max-width: 420px; margin: 20px auto; padding: 24px;">
        <h1 class="text-center" style="color: var(--accent-color); font-size: 1.4rem; font-weight: 800; text-transform: uppercase; letter-spacing: -0.5px; margin-bottom: 18px;">
            Вход
        </h1>

        <form method="post" class="form-fields" style="display: flex; flex-direction: column; gap: 14px;">
            {% csrf_token %}

            {% if form.errors %}
                <div class="custom-alert" style="padding: 8px 12px; font-size: 0.85rem; color: #dc3545; border-color: #dc3545;">
                    Неверный Email или пароль.
                </div>
            {% endif %}

            <!-- Поле Email -->
            <div style="display: flex; flex-direction: column; gap: 4px;">
                <label for="{{ form.username.id_for_label }}">Email</label>
                {{ form.username }}
            </div>

            <div style="display: flex; flex-direction: column; gap: 4px;">
                <label for="{{ form.password.id_for_label }}">Пароль</label>
                {{ form.password }}
            </div>

            <button type="submit" class="btn-accent" style="padding: 10px; margin-top: 4px; cursor: pointer;">
                Войти
            </button>
            <div style="text-align: center; margin-top: 10px;">
    <a href="{% url 'users:password_reset' %}" style="color: var(--accent-color); font-size: 0.85rem; text-decoration: none;">Забыли пароль?</a>
</div>
        </form>
    </div>
</div>
{% endblock %}
